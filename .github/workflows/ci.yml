name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Test
        run: dotnet test 260001_be.Tests --configuration Release

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 260001_fe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: 260001_fe/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
