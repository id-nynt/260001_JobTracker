# Local PostgreSQL for development: docker compose up -d db
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: jobtracker
      POSTGRES_USER: jobtracker
      POSTGRES_PASSWORD: jobtracker
    ports:
      - "5432:5432"
    volumes:
      - jobtracker-data:/var/lib/postgresql/data

volumes:
  jobtracker-data:
